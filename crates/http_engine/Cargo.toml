[package]
name = "fetchbox-http-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The FTP and SFTP servers the tests are built on, also for the tests of the server crate.
# Off in every real build.
test-servers = ["dep:rcgen", "dep:rand"]

[dependencies]
fetchbox-core.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "time"] }
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
bytes.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
sha2.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
rand = { version = "0.10", optional = true }
sha1.workspace = true
md-5.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "io-util", "net"] }
tempfile = "3"
# The test servers (a throwaway certificate for the TLS tests, a host key for SSH).
fetchbox-http-engine = { workspace = true, features = ["test-servers"] }
