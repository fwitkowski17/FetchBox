[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/http_engine",
    "crates/torrent_engine",
    "crates/storage",
    "crates/api",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
dlm-core = { path = "crates/core" }
dlm-http-engine = { path = "crates/http_engine" }
dlm-torrent-engine = { path = "crates/torrent_engine" }
dlm-storage = { path = "crates/storage" }
dlm-api = { path = "crates/api" }

# Async runtime + web server (one runtime, one HTTP stack)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.8"
async-trait = "0.1"

# Embedded frontend: serve web/dist from the binary
rust-embed = "8"
mime_guess = "2"

# SQLite, bundled so the final image needs no system libsqlite
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization, errors, logging, CLI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
