[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/http_engine",
    "crates/torrent_engine",
    "crates/storage",
    "crates/api",
    "crates/server",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
fetchbox-core = { path = "crates/core" }
fetchbox-http-engine = { path = "crates/http_engine" }
fetchbox-torrent-engine = { path = "crates/torrent_engine" }
fetchbox-storage = { path = "crates/storage" }
fetchbox-api = { path = "crates/api" }

# Async runtime + web server (one runtime, one HTTP stack)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.8"
async-trait = "0.1"

# HTTP client for the download engine (rustls, no OpenSSL in the final image)
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false }

# OpenAPI schema generation (derive only; no UI assets, so the binary stays small)
utoipa = { version = "5", default-features = false, features = ["macros"] }

# OS randomness for session tokens (tiny, no RNG framework needed)
getrandom = "0.3"

# Password hashing for the account created in the first-run setup. Pure Rust, no system
# library; the salt comes from getrandom, so the RNG features stay off.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

# Checksums of finished downloads (md5, sha1, sha256, sha512): the RustCrypto implementations,
# pure Rust, no system library. They use the CPU's SHA instructions when it has them. Pulled in by
# `argon2` already: `digest` and `cpufeatures`; each of these crates is a few thousand lines.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"

# SFTP (SPEC 6.12): an SSH client and the SFTP protocol on top of it, pure Rust, so the final image
# still needs no system library. The `ring` backend (already built for rustls) keeps C code such as
# aws-lc out; `rsa` is for servers whose only host key is an RSA one. Most of the ~100 crates it
# adds are the RustCrypto building blocks of SSH (ciphers, key exchange, signatures).
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"

# FTP over TLS (FTPS): the FTP client itself is a few hundred lines of our own (a dependency such as
# suppaftp would add about twenty crates for what is a simple text protocol). TLS and the root
# certificates are the ones reqwest already uses, so these three add no new crates to the build.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
bytes = "1"

# Free disk space (statvfs) without `unsafe` or libc. Already built as a dependency of
# `tempfile`, so it adds nothing new to the build; Unix only (Linux, macOS).
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# BitTorrent (SPEC 6.13): the engine behind `torrent_engine`. Default features off: no native-tls /
# OpenSSL (`rust-tls` uses the same TLS family as the rest of the program), no HTTP API of its own and
# no bundled web UI; only the session, the peer protocol, DHT, trackers and uTP are used.
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }

# Embedded frontend: serve web/dist from the binary
rust-embed = "8"
mime_guess = "2"

# SQLite, bundled so the final image needs no system libsqlite
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization, errors, logging, CLI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

# One small upstream crate is patched (see vendor/librqbit-tracker-comms/README.fetchbox.md): without
# it the BitTorrent engine cannot start on a host whose kernel has no IPv6.
[patch.crates-io]
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Argon2 is deliberately slow; unoptimised debug builds would make login take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
