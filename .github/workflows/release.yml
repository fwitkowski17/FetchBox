name: Release

# Push a tag `v<version>` (the version in Cargo.toml, e.g. v0.6.1) and this builds the web UI and the
# binary for x86_64 and aarch64 Linux, wraps each in a DEB and an RPM (packaging/), installs every
# package in a clean container as a test, then publishes a GitHub Release with the archives and
# packages attached. The installers (deploy/) and the update check in the app read that release.

on:
  push:
    tags: ["v*"]
  # Started by tag.yml for the tag it has just made (a tag pushed with the workflow token does not
  # start workflows by itself), and by hand: run it on the tag's ref, not on a branch.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The app compares the release tag with its own version to say "an update is available", so a
      # tag that differs from the version inside the binary would be a lie.
      - name: Compare the tag with the workspace version
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          echo "Cargo.toml: ${version}, tag: ${GITHUB_REF_NAME}"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  binary:
    name: Binary (${{ matrix.arch }})
    needs: web
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Built on Debian 12 (glibc 2.36) on purpose, although the Docker image and the Proxmox
    # container are on Debian 13: a binary needs at least the glibc it was linked against, so the
    # older builder gives a binary that runs on Debian 12 and 13, Ubuntu 22.04 and newer and
    # Raspberry Pi OS. Nothing from the builder ends up in the binary or is patched later (the libc
    # is the one of the machine it runs on), so "oldstable" costs nothing here. Move to
    # `rust:1-trixie` when Debian 12 no longer needs to be supported: the floor becomes glibc 2.41.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo build --release --locked -p server
      - name: Package
        run: |
          mkdir -p out
          # The archive holds just the binary, at its top level; the web UI is inside it.
          tar -C target/release -czf "out/fetchbox-linux-${{ matrix.arch }}.tar.gz" fetchbox
          (cd out && sha256sum "fetchbox-linux-${{ matrix.arch }}.tar.gz" > "fetchbox-linux-${{ matrix.arch }}.tar.gz.sha256")
          ./target/release/fetchbox --version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/*

  packages:
    name: Packages (${{ matrix.arch }})
    needs: binary
    strategy:
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
          - arch: aarch64
            deb_arch: arm64
    # nfpm only assembles files, so both CPUs are packaged on the same x86_64 runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nfpm
      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: binary
      - name: Build the DEB and the RPM
        run: |
          set -euo pipefail
          tar -xzf "binary/fetchbox-linux-${{ matrix.arch }}.tar.gz" -C binary fetchbox
          packaging/build.sh "${GITHUB_REF_NAME#v}" "${{ matrix.deb_arch }}" binary/fetchbox out
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out/*

  # Installs each package on a clean system of its own CPU, starts the program and removes the
  # package again: this is also what proves that the binary runs on the oldest system we claim.
  package-test:
    name: Test ${{ matrix.format }} (${{ matrix.arch }})
    needs: packages
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, format: deb, image: "debian:12", file: "fetchbox_*_amd64.deb" }
          - { arch: x86_64, runner: ubuntu-latest, format: rpm, image: "fedora:latest", file: "fetchbox-*.x86_64.rpm" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, format: deb, image: "debian:12", file: "fetchbox_*_arm64.deb" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, format: rpm, image: "fedora:latest", file: "fetchbox-*.aarch64.rpm" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out
      - name: Install, run and remove the package
        run: |
          set -eu
          pkg="$(ls out/${{ matrix.file }})"
          packaging/smoke-test.sh "$pkg" "${GITHUB_REF_NAME#v}" --run

  release:
    needs: [binary, packages, package-test]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{binary,packages}-*"
          merge-multiple: true
          path: out
      - name: Publish the release
        run: |
          ls -l out
          prerelease=""
          # A tag like v0.7.0-rc.1 is a pre-release: the update check in the app skips those.
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # The release was made by hand first (the web page): only add the files.
            gh release upload "${GITHUB_REF_NAME}" out/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" out/* --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes ${prerelease}
          fi
