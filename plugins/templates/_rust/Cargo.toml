[package]
# The prefix keeps an id such as "test" or "core" from being the name of a crate that already exists.
name = "fetchbox-plugin-__ID__"
version = "0.1.0"
edition = "2021"
publish = false

# The release workflow uploads this program; plugin.json names it as a dependency.
[[bin]]
name = "__ID__"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# Keeps cargo from looking for a workspace above this folder (for example when the project sits
# inside a FetchBox checkout while you develop it).
[workspace]
